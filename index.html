<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/startup-preferences.js"></script>
    <link rel="stylesheet" href="/startup.css" />
    <title data-i18n="卓控台">卓控台</title>
  </head>
  <body>
    <div id="app-startup" class="startup-stage" data-state="loading" role="status" aria-live="polite" data-i18n-label="卓控台启动中" aria-label="卓控台启动中">
      <div class="startup-grid" aria-hidden="true"></div>
      <div class="startup-panel">
        <div class="startup-visual" aria-hidden="true">
          <div class="startup-halo"></div>
          <div class="startup-orbit"></div>
          <div class="startup-emblem">
            <img src="/favicon.svg" width="72" height="72" alt="" />
          </div>
          <div class="startup-scan"></div>
        </div>
        <div class="startup-brand">
          <h1 data-i18n="卓控台">卓控台</h1>
          <p data-i18n="连接设备 · 专注调试">连接设备 · 专注调试</p>
        </div>
        <div class="startup-feedback">
          <p id="startup-status" data-i18n="正在准备工作区">正在准备工作区</p>
          <p id="startup-detail"></p>
          <button id="startup-retry" class="startup-retry" type="button" data-i18n="重新尝试" hidden>重新尝试</button>
        </div>
      </div>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
